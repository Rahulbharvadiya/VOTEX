name: VOTEX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint, Security & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio argon2-cffi PyJWT pydantic pydantic-settings starlette fastapi uvicorn pillow requests

      - name: Run vendor scrub verification
        run: |
          PYTHONPATH=src pytest tests/unit/test_vendor_scrub.py -v

      - name: Run unit and integration tests
        run: |
          PYTHONPATH=src pytest tests/unit tests/integration -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build frontend distribution
        working-directory: frontend
        run: npm run build
